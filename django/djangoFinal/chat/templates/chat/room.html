{% extends "chat/base.html" %}
{% block title %}Create a chatroom{% endblock %}
{% block style%} {% endblock %}
{%block content%}
<br> 
<center>
    {% if user.is_authenticated %}
<div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-4 col-xl-3 chat">
                <div class="card mb-sm-3 mb-md-0 contacts_card">
                    <div class="card-header">
                        <h3>Connected members</h3>
                    </div>
                    <div class="card-body contacts_body">
                        <ul class="contacts" id="members-list">
                        </ul>
                    </div>
                    <div class="card-footer"></div>
                </div>
            </div>
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <div class="user_info">
                                <span>{{room_name}}</span>
                            </div>
                            <div class="video_cam">
                                <span><i class="fas fa-video"></i></span>
                                <span><i class="fas fa-phone"></i></span>
                            </div>
                        </div>
                    </div>
                    <div class="card-body msg_card_body" id="messages_input">
                    </div>
                    <div class="card-footer">
                        <div class="input-group">
                            <div class="input-group-append">
                                <span class="input-group-text attach_btn"><i class="fas fa-paperclip"></i></span>
                            </div>
                            <textarea name="" class="form-control type_msg" placeholder="Type your message..."></textarea>
                            <div class="input-group-append">
                                <span class="input-group-text send_btn"><i class="fas fa-location-arrow">Send</i></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{ room_name|json_script:"room-name" }}
    <script>
        const roomName = JSON.parse(document.getElementById('room-name').textContent);
        const chatProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';

        const chatSocket = new WebSocket(
            chatProtocol + '://'
            + window.location.host
            + '/ws/chat/'
            + roomName
            + '/'
        );

        const messagesContainer = document.querySelector('#messages_input');
        const membersList = document.querySelector('#members-list');
        const messageInput = document.querySelector('.type_msg');
        const sendButton = document.querySelector('.send_btn');

        function appendMessage(message) {
            if (!messagesContainer || !message) {
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'd-flex justify-content-start mb-4';

            const bubble = document.createElement('div');
            bubble.className = 'msg_cotainer';
            bubble.textContent = message;

            wrapper.appendChild(bubble);
            messagesContainer.appendChild(wrapper);
        }

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);

             if (data.message) {
                appendMessage(data.message);
            }

            if (data.messages && data.messages.length > 0 && messagesContainer) {
                messagesContainer.innerHTML = '';
                data.messages.forEach(msg => appendMessage(msg));
            }


            if (data.members_connected && data.members_connected.length > 0) {
                if (membersList) {
                    membersList.innerHTML = '';
                    data.members_connected.forEach(member => {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <div class="d-flex bd-highlight">
                                <div class="user_info">
                                    <span>${member}</span>
                                </div>
                            </div>
                        `;
                        membersList.appendChild(li);
                    });
                }
            }
        };

        chatSocket.onclose = function(e) {
            console.error('Chat socket closed unexpectedly');
        };

        function sendMessage() {
            if (!messageInput) {
                return;
            }

            const message = messageInput.value;

            if (message.trim() === '') {
                return;
            }

            if (chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({'message': message}));
                messageInput.value = '';
            }
        }

        if (messageInput) {
            messageInput.focus();
            messageInput.addEventListener('keydown', function(e) {
                if (e.key !== 'Enter' || e.shiftKey) {
                    return;
                }

                e.preventDefault();
                sendMessage();
            });
        }

        if (sendButton) {
            sendButton.addEventListener('click', function(e) {
                e.preventDefault();
                sendMessage();
            });
        }
    </script>
    {% else %}
    <h2>No user logged!</h1>
    </center>
    {%endif%}
    {%endblock%}
